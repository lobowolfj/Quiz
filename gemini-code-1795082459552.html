<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz: Afro - Das origens aos destinos</title>
  <!-- Biblioteca oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f5;
      --muted: #b3b3b3;
      --gold: #f59e0b;
      --green: #16a34a;
      --red: #dc2626;
      --opt1: #e11d48;
      --opt2: #2563eb;
      --opt3: #d97706;
      --opt4: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2a1810, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    /* Tela Inicial */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #3f3f46;
      background: #141414;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--gold);
      color: #111;
      width: 100%;
    }

    .btn-secondary {
      background: #2e2e32;
      color: #fff;
      width: 100%;
      margin-top: 10px;
    }

    /* Cabeçalho do Quiz */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .timer-badge {
      background: #27272a;
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 1rem;
    }

    .timer-bar-bg {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--gold);
      transition: width 1s linear;
    }

    .question-text {
      font-size: 1.3rem;
      margin-bottom: 22px;
      line-height: 1.4;
      text-align: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      padding: 18px 16px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, opacity 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      transform: scale(1.02);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-0 { background: var(--opt1); }
    .opt-1 { background: var(--opt2); }
    .opt-2 { background: var(--opt3); }
    .opt-3 { background: var(--opt4); }

    .option-btn.correct {
      background: var(--green) !important;
      box-shadow: 0 0 0 3px #bbf7d0;
    }

    .option-btn.wrong {
      background: var(--red) !important;
      opacity: 0.65;
    }

    .option-btn.dimmed {
      opacity: 0.35;
    }

    .feedback {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 24px;
      font-size: 1.05rem;
    }

    /* Card do Vencedor e Ranking */
    .winner-box {
      background: linear-gradient(135deg, #422006, #1c1917);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }

    .winner-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .winner-name {
      font-size: 1.7rem;
      font-weight: bold;
      color: #fff;
    }

    .winner-score {
      font-size: 1.15rem;
      color: #fde68a;
      margin-top: 4px;
    }

    .your-score {
      text-align: center;
      background: #27272a;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .ranking-list {
      list-style: none;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #262626;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .ranking-item:first-child {
      border-left: 4px solid var(--gold);
    }

    .status-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- TELA INICIAL -->
    <section id="start-screen">
      <h1>Quiz: Afro — Das origens aos destinos</h1>
      <p class="subtitle">10 perguntas sobre o documentário da Embratur • 20 segundos por questão</p>

      <div class="input-group">
        <label for="player-name">Digite seu nome para participar:</label>
        <input type="text" id="player-name" placeholder="Ex: Maria Silva" maxlength="40" />
        <button class="btn btn-primary" id="start-btn">Iniciar Quiz</button>
        <button class="btn btn-secondary" id="view-ranking-btn">Ver Vencedor e Ranking Atual</button>
      </div>
    </section>

    <!-- TELA DO QUIZ -->
    <section id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <span id="question-counter">Pergunta 1 / 10</span>
        <span id="live-score">Pontos: 0</span>
        <span class="timer-badge" id="timer-text">20s</span>
      </div>

      <div class="timer-bar-bg">
        <div class="timer-bar-fill" id="timer-bar"></div>
      </div>

      <h2 class="question-text" id="question-text"></h2>
      <div class="options-grid" id="options-container"></div>
      <div class="feedback" id="feedback"></div>
    </section>

    <!-- TELA FINAL / RANKING -->
    <section id="result-screen" class="hidden">
      <h1>Resultado &amp; Placar</h1>

      <div id="your-result-box" class="your-score hidden"></div>

      <!-- Destaque do Vencedor -->
      <div class="winner-box">
        <div class="winner-label">🏆 Vencedor Atual (1º Lugar)</div>
        <div class="winner-name" id="winner-name">Carregando...</div>
        <div class="winner-score" id="winner-score"></div>
      </div>

      <h3>Top 10 Jogadores</h3>
      <ul class="ranking-list" id="ranking-list"></ul>
      <p class="status-msg" id="db-status"></p>

      <button class="btn btn-primary" id="refresh-ranking-btn" style="margin-top: 18px;">Atualizar Placar</button>
      <button class="btn btn-secondary" id="restart-btn">Jogar Novamente</button>
    </section>
  </div>

  <script>
    // ==========================================================
    // 1. CONFIGURAÇÃO DO SUPABASE (SUBSTITUA PELOS SEUS DADOS)
    // ==========================================================
    const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
    const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';

    const supabaseConfigurado =
      SUPABASE_URL !== 'SUA_SUPABASE_URL_AQUI' &&
      SUPABASE_ANON_KEY !== 'SUA_SUPABASE_ANON_KEY_AQUI';

    const supabaseClient = supabaseConfigurado
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // ==========================================================
    // 2. BANCO DE QUESTÕES (PDF: Afro - Das origens aos destinos)
    // ==========================================================
    const questions = [
      {
        question: "Qual conceito central mostra como a cultura negra impulsiona viagens e a economia local?",
        options: ["Afroturismo", "Ecoturismo rural", "Turismo de negócios", "Intercâmbio acadêmico"],
        answer: 0
      },
      {
        question: "Em quais localidades da Bahia o documentário concentra grande parte de suas histórias?",
        options: [
          "Chapada Diamantina e Ilhéus",
          "Salvador e Recôncavo Baiano",
          "Porto Seguro e Trancoso",
          "Barreiras e Vitória da Conquista"
        ],
        answer: 1
      },
      {
        question: "Qual prato tradicional associado à história de mulheres negras nas ruas é citado no filme?",
        options: ["Feijoada", "Moqueca capixaba", "Acarajé", "Baião de dois"],
        answer: 2
      },
      {
        question: "Qual prato ligado a Cachoeira no Recôncavo aparece como atração cultural e gastronômica?",
        options: ["Caruru", "Vatapá", "Sarapatel", "Maniçoba"],
        answer: 3
      },
      {
        question: "Qual grupo tradicional é lembrado ao tratar de fé, memória e celebrações culturais?",
        options: [
          "Irmandade da Boa Morte",
          "Ordem Terceira do Carmo",
          "Congada de Minas",
          "Folia de Reis"
        ],
        answer: 0
      },
      {
        question: "Qual bloco afro histórico é mencionado a partir do legado de Mãe Hilda Jitolú?",
        options: ["Olodum", "Ilê Aiyê", "Filhos de Gandhy", "Muzenza"],
        answer: 1
      },
      {
        question: "Segundo o documentário, o que o uso de tranças e a estética afro representam?",
        options: [
          "Apenas tendência passageira",
          "Padrão estético europeu",
          "Identidade e afirmação cultural",
          "Uniforme escolar obrigatório"
        ],
        answer: 2
      },
      {
        question: "Como a capoeira é retratada no documentário em relação à história do povo negro?",
        options: [
          "Apenas esporte olímpico",
          "Dança trazida da Europa",
          "Atividade recreativa recente",
          "Expressão cultural e resistência"
        ],
        answer: 3
      },
      {
        question: "Qual é um dos efeitos econômicos do afroturismo apontados para os moradores locais?",
        options: [
          "Geração de renda com cultura local",
          "Substituição do comércio local",
          "Aumento de impostos municipais",
          "Fechamento de feiras livres"
        ],
        answer: 0
      },
      {
        question: "Qual postura o documentário incentiva nas pessoas que participam dessas vivências?",
        options: [
          "Observação distante e passiva",
          "Escuta e valorização ancestral",
          "Consumo rápido sem diálogo",
          "Padronização das tradições"
        ],
        answer: 1
      }
    ];

    // ==========================================================
    // 3. ESTADO E ELEMENTOS DA INTERFACE
    // ==========================================================
    const TIME_LIMIT = 20;
    let playerName = "";
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let timeLeft = TIME_LIMIT;
    let timerInterval = null;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    const playerNameInput = document.getElementById("player-name");
    const questionCounter = document.getElementById("question-counter");
    const liveScore = document.getElementById("live-score");
    const timerText = document.getElementById("timer-text");
    const timerBar = document.getElementById("timer-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackEl = document.getElementById("feedback");

    const yourResultBox = document.getElementById("your-result-box");
    const winnerNameEl = document.getElementById("winner-name");
    const winnerScoreEl = document.getElementById("winner-score");
    const rankingListEl = document.getElementById("ranking-list");
    const dbStatusEl = document.getElementById("db-status");

    // Evita injeção de HTML ao renderizar nomes vindos do banco
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // ==========================================================
    // 4. LÓGICA DO QUIZ
    // ==========================================================
    document.getElementById("start-btn").addEventListener("click", () => {
      const name = playerNameInput.value.trim();
      if (!name) {
        alert("Por favor, digite seu nome antes de começar.");
        playerNameInput.focus();
        return;
      }
      playerName = name;
      currentIndex = 0;
      score = 0;
      correctCount = 0;

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      loadQuestion();
    });

    document.getElementById("view-ranking-btn").addEventListener("click", async () => {
      startScreen.classList.add("hidden");
      yourResultBox.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      await loadLeaderboard();
    });

    document.getElementById("refresh-ranking-btn").addEventListener("click", loadLeaderboard);

    document.getElementById("restart-btn").addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    function loadQuestion() {
      clearInterval(timerInterval);
      const q = questions[currentIndex];

      questionCounter.textContent = `Pergunta ${currentIndex + 1} / ${questions.length}`;
      liveScore.textContent = `Pontos: ${score}`;
      questionText.textContent = q.question;
      feedbackEl.textContent = "";
      optionsContainer.innerHTML = "";

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = `option-btn opt-${idx}`;
        btn.textContent = `${idx + 1}. ${optText}`;
        btn.addEventListener("click", () => selectAnswer(idx));
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      timeLeft = TIME_LIMIT;
      timerText.textContent = `${timeLeft}s`;
      timerBar.style.transition = "none";
      timerBar.style.width = "100%";

      // Força reflow para reiniciar a animação da barra
      void timerBar.offsetWidth;
      timerBar.style.transition = "width 1s linear";

      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.textContent = `${timeLeft}s`;
        timerBar.style.width = `${(timeLeft / TIME_LIMIT) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          selectAnswer(-1); // Tempo esgotado
        }
      }, 1000);
    }

    function selectAnswer(selectedIdx) {
      clearInterval(timerInterval);
      const q = questions[currentIndex];
      const buttons = optionsContainer.querySelectorAll(".option-btn");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx) {
          btn.classList.add("wrong");
        } else {
          btn.classList.add("dimmed");
        }
      });

      if (selectedIdx === q.answer) {
        // 500 pontos base + 25 pontos por segundo restante
        const gained = 500 + timeLeft * 25;
        score += gained;
        correctCount++;
        liveScore.textContent = `Pontos: ${score}`;
        feedbackEl.style.color = "#4ade80";
        feedbackEl.textContent = `Correto! +${gained} pontos`;
      } else if (selectedIdx === -1) {
        feedbackEl.style.color = "#f87171";
        feedbackEl.textContent = "Tempo esgotado!";
      } else {
        feedbackEl.style.color = "#f87171";
        feedbackEl.textContent = "Incorreto!";
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < questions.length) {
          loadQuestion();
        } else {
          finishQuiz();
        }
      }, 1600);
    }

    // ==========================================================
    // 5. INTEGRAÇÃO COM O SUPABASE (SALVAR E MOSTRAR VENCEDOR)
    // ==========================================================
    async function finishQuiz() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      yourResultBox.classList.remove("hidden");
      yourResultBox.innerHTML = `
        <strong>${escapeHtml(playerName)}</strong>, você fez
        <strong>${score} pontos</strong> (${correctCount} de ${questions.length} acertos).
      `;

      if (supabaseClient) {
        dbStatusEl.textContent = "Salvando sua pontuação no Supabase...";
        const { error } = await supabaseClient
          .from("pontuacoes_quiz")
          .insert([{ nome: playerName, pontuacao: score, acertos: correctCount }]);

        if (error) {
          console.error(error);
          dbStatusEl.textContent = "Erro ao salvar no Supabase. Verifique a URL, chave e políticas RLS.";
        } else {
          dbStatusEl.textContent = "Pontuação registrada com sucesso!";
        }
      }

      await loadLeaderboard();
    }

    async function loadLeaderboard() {
      if (!supabaseClient) {
        winnerNameEl.textContent = "Supabase não configurado";
        winnerScoreEl.textContent = "Insira SUA_SUPABASE_URL e SUA_SUPABASE_ANON_KEY no código.";
        rankingListEl.innerHTML = "";
        return;
      }

      const { data, error } = await supabaseClient
        .from("pontuacoes_quiz")
        .select("nome, pontuacao, acertos")
        .order("pontuacao", { ascending: false })
        .order("created_at", { ascending: true })
        .limit(10);

      if (error) {
        console.error(error);
        winnerNameEl.textContent = "Erro ao carregar placar";
        winnerScoreEl.textContent = "";
        return;
      }

      if (!data || data.length === 0) {
        winnerNameEl.textContent = "Nenhum jogador ainda";
        winnerScoreEl.textContent = "Seja o primeiro a completar o quiz!";
        rankingListEl.innerHTML = "";
        return;
      }

      // Exibe o 1º lugar no card de Vencedor
      const winner = data[0];
      winnerNameEl.textContent = winner.nome;
      winnerScoreEl.textContent = `${winner.pontuacao} pontos (${winner.acertos}/10 acertos)`;

      // Preenche o Top 10
      rankingListEl.innerHTML = data
        .map((item, index) => `
          <li class="ranking-item">
            <span><strong>#${index + 1}</strong> ${escapeHtml(item.nome)}</span>
            <span><strong>${item.pontuacao} pts</strong> (${item.acertos}/10)</span>
          </li>
        `)
        .join("");
    }
  </script>
</body>
</html>
